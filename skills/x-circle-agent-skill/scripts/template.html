<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>X 宇宙</title>
<style>
  html, body { margin: 0; padding: 0; background: #04050b; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
(() => {
  const SANS = '"PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif';
  const SERIF = '"Songti SC", "STSong", "Noto Serif CJK SC", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif';
  const NUM = '"Avenir Next", "Helvetica Neue", "Segoe UI", ' + SANS;
  const NS = 'http://www.w3.org/2000/svg';
  const C = {
    like: '#ff8fb8', repost: '#6fe3bd', reply: '#93c8ff', quote: '#c6a8ff', mention: '#93c8ff', follow: '#f3d08a',
    gold: '#f3d08a', text: '#f5f1e8', soft: 'rgba(245,241,232,0.84)', muted: 'rgba(228,224,240,0.56)', dim: 'rgba(228,224,240,0.34)',
    me: '#f3d08a', circle: '#c4e0ff',
  };
  const DAYS = ['一', '二', '三', '四', '五', '六', '日'];
  // Chart geometry: my avatar, the week dial (168 hourly bars) and the people orbits.
  const G = { me: 30, dial: 404, outMax: 34, inMax: 13, dayR: 458 };
  const RINGS = {
    inner:  { R: 142, jit: 5, size: 27, label: 14 },
    middle: { R: 228, jit: 8, size: 19, label: 12 },
    outer:  { R: 298, jit: 7, size: 14.5, label: 10.5 },
    halo:   { R: 360, jit: 5, size: 11.5, label: 10 },
  };
  const M = 60;
  const LAYOUTS = {
    // 4:5 poster for the timeline: stats sit in the four corners around the dial
    poster: { W: 1080, H: 1350, cx: 540, cy: 672, over: 64, titleY: 140, subY: 182, corners: [258, 1052], footY: 1176, legendY: 1334 },
    // 9:16 story for the video: stats in a row under the dial
    story: { W: 1080, H: 1920, cx: 540, cy: 876, over: 176, titleY: 254, subY: 298, clockY: 366, statsY: 1440, footY: 1546, thanksY: 1756, legendY: 1878 },
  };
  // Video timeline (seconds)
  const T = { week0: 2.6, weekDur: 7, halo: 9.9, post: 10.9, thanks: 12, end: 15 };

  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', { x, y, ...attrs }, parent); t.textContent = s; return t; };
  const span = (parent, s, attrs = {}) => { const t = el('tspan', attrs, parent); t.textContent = s; return t; };
  const hash = (s) => { let h = 2166136261; for (const ch of String(s)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const rng = (seed) => { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; };
  const ctx = document.createElement('canvas').getContext('2d');
  const measure = (s, size, weight = 400, family = SANS) => { ctx.font = `${weight} ${size}px ${family}`; return ctx.measureText(s).width; };
  const fit = (s, size, maxW, weight, family) => {
    if (measure(s, size, weight, family) <= maxW) return s;
    const ch = [...s];
    while (ch.length > 1 && measure(ch.join('') + '…', size, weight, family) > maxW) ch.pop();
    return ch.join('') + '…';
  };
  const wrap = (s, size, maxW, maxLines, family) => {
    const lines = [];
    let cur = '';
    const chars = [...s.replace(/\s+/g, ' ').trim()];
    for (let i = 0; i < chars.length; i++) {
      if (measure(cur + chars[i], size, 400, family) > maxW) {
        if (lines.length === maxLines - 1) { lines.push(fit(cur + chars.slice(i).join(''), size, maxW, 400, family)); return lines; }
        lines.push(cur); cur = chars[i].trimStart();
      } else cur += chars[i];
    }
    if (cur) lines.push(cur);
    return lines;
  };
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const prog = (t, a, d) => clamp01((t - a) / d);
  const outCubic = (x) => 1 - Math.pow(1 - x, 3);
  const outBack = (x) => { const c1 = 1.7, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const slotAngle = (h) => -Math.PI / 2 + (2 * Math.PI * h) / 168;
  const deg = (a) => (a * 180) / Math.PI;

  let anims = [];
  const anim = (fn) => anims.push(fn);

  function avatar(parent, r, url, name, seed, defs) {
    if (url) {
      el('image', { href: url, x: -r, y: -r, width: 2 * r, height: 2 * r, 'clip-path': 'url(#round)', preserveAspectRatio: 'xMidYMid slice' }, parent);
    } else {
      const h = hash(seed) % 360;
      const id = 'fb' + hash(seed + 'g');
      if (!defs.querySelector('#' + id)) {
        const g = el('linearGradient', { id, x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
        el('stop', { offset: 0, 'stop-color': `hsl(${h},45%,58%)` }, g);
        el('stop', { offset: 1, 'stop-color': `hsl(${(h + 50) % 360},45%,34%)` }, g);
      }
      el('circle', { r, fill: `url(#${id})` }, parent);
      txt(parent, 0, r * 0.36, [...(name || '?')][0].toUpperCase(), { 'text-anchor': 'middle', 'font-size': r, 'font-weight': 600, fill: '#fff' });
    }
  }

  // The deep-sky backdrop (glow, milky way, dust, field stars, vignette, film grain) is painted once on a canvas.
  function backdrop(L, seed) {
    const { W, H, cx, cy } = L;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const cv = document.createElement('canvas');
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext('2d');
    g.scale(dpr, dpr);
    const rand = rng(seed);
    const gauss = () => { let u = 0; for (let i = 0; i < 6; i++) u += rand(); return (u - 3) / 1.2; };
    const blob = (x, y, rx, ry, rot, rgb, a) => {
      g.save(); g.translate(x, y); g.rotate(rot); g.scale(rx / ry, 1);
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, ry);
      gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`);
      g.fillStyle = gr; g.beginPath(); g.arc(0, 0, ry, 0, 7); g.fill(); g.restore();
    };
    g.fillStyle = '#04050b'; g.fillRect(0, 0, W, H);
    blob(cx, cy, W * 0.78, W * 0.78, 0, '30,36,92', 0.55);
    blob(cx, cy, 300, 300, 0, '255,196,120', 0.07);
    // milky way: a band crossing behind the chart from lower left to upper right
    const ang = -0.56, ux = Math.cos(ang), uy = Math.sin(ang), nx = -uy, ny = ux, len = Math.hypot(W, H);
    const tones = [['118,88,255', 0.11], ['70,160,235', 0.09], ['255,168,120', 0.05], ['196,110,255', 0.07], ['120,210,255', 0.05]];
    for (let i = 0; i < 34; i++) {
      const s = (rand() - 0.5) * len, o = gauss() * 60;
      const [rgb, a] = tones[i % tones.length];
      blob(cx + ux * s + nx * o, cy + uy * s + ny * o, 260 + rand() * 220, 90 + rand() * 80, ang, rgb, a);
    }
    for (let i = 0; i < 9000; i++) {
      const s = (rand() - 0.5) * len, o = gauss() * 80;
      const x = cx + ux * s + nx * o, y = cy + uy * s + ny * o;
      g.fillStyle = `rgba(${rand() < 0.2 ? '255,232,205' : '222,228,255'},${0.06 + rand() * 0.3})`;
      g.fillRect(x, y, 0.9, 0.9);
    }
    // dark dust lanes along the band
    for (let i = 0; i < 12; i++) {
      const s = (rand() - 0.5) * len * 0.9, o = 10 + gauss() * 20;
      blob(cx + ux * s + nx * o, cy + uy * s + ny * o, 160 + rand() * 160, 18 + rand() * 22, ang + (rand() - 0.5) * 0.2, '4,5,11', 0.45);
    }
    // field stars
    const n = Math.round((W * H) / 1300);
    for (let i = 0; i < n; i++) {
      const r = Math.pow(rand(), 5) * 1.6 + 0.3, a = 0.18 + rand() * 0.6;
      const tint = rand(); const rgb = tint < 0.12 ? '255,226,190' : tint < 0.24 ? '200,220,255' : '238,240,255';
      g.fillStyle = `rgba(${rgb},${a})`; g.beginPath(); g.arc(rand() * W, rand() * H, r, 0, 7); g.fill();
    }
    for (let i = 0; i < 22; i++) {
      const x = rand() * W, y = rand() * H, r = 5 + rand() * 12;
      blob(x, y, r, r, 0, rand() < 0.3 ? '255,220,170' : '200,215,255', 0.35);
      g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.arc(x, y, 0.9 + rand() * 0.6, 0, 7); g.fill();
    }
    // vignette
    const vg = g.createRadialGradient(cx, H / 2, Math.min(W, H) * 0.42, cx, H / 2, len * 0.62);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.62)');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
    // film grain
    const img = g.getImageData(0, 0, cv.width, cv.height), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const v = (rand() - 0.5) * 14; d[i] += v; d[i + 1] += v; d[i + 2] += v; }
    g.putImageData(img, 0, 0);
    return cv.toDataURL('image/jpeg', 0.92);
  }

  function build(model, layoutName) {
    const L = LAYOUTS[layoutName];
    const video = layoutName === 'story';
    const { W, H, cx, cy } = L;
    anims = [];
    const svg = document.getElementById('stage');
    svg.innerHTML = '';
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('font-family', SANS); // an attribute, so per-element font-family attributes still win
    const defs = el('defs', {}, svg);

    // ---------- defs ----------
    const radial = (id, color, op) => {
      const g = el('radialGradient', { id }, defs);
      el('stop', { offset: 0, 'stop-color': color, 'stop-opacity': op }, g);
      el('stop', { offset: 0.35, 'stop-color': color, 'stop-opacity': op * 0.4 }, g);
      el('stop', { offset: 1, 'stop-color': color, 'stop-opacity': 0 }, g);
    };
    radial('sun', '#ffd796', 0.42);
    ['like', 'repost', 'reply', 'quote', 'mention', 'follow'].forEach((k) => radial('glow-' + k, C[k], 0.34));
    const linear = (id, stops, attrs) => {
      const g = el('linearGradient', { id, ...attrs }, defs);
      stops.forEach(([o, c, a = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g));
    };
    linear('gold', [[0, '#fff3d6'], [0.55, '#f3d08a'], [1, '#d6a25e']], { x1: 0, y1: 0, x2: 1, y2: 1 });
    linear('spikeH', [[0, '#fff', 0], [0.5, '#fff', 0.75], [1, '#fff', 0]], { x1: 0, y1: 0, x2: 1, y2: 0 });
    linear('spikeV', [[0, '#fff', 0], [0.5, '#fff', 0.75], [1, '#fff', 0]], { x1: 0, y1: 0, x2: 0, y2: 1 });
    linear('rule', [[0, '#f3d08a', 0], [0.5, '#f3d08a', 0.45], [1, '#f3d08a', 0]], { x1: 0, y1: 0, x2: 1, y2: 0 });
    const round = el('clipPath', { id: 'round', clipPathUnits: 'objectBoundingBox' }, defs);
    el('circle', { cx: 0.5, cy: 0.5, r: 0.5 }, round);

    // ---------- background ----------
    el('image', { href: backdrop(L, hash(model.me.handle + layoutName)), x: 0, y: 0, width: W, height: H, preserveAspectRatio: 'none' }, svg);
    const twinkle = el('g', {}, svg);
    const rand = rng(hash(model.me.handle + 'tw'));
    for (let i = 0; i < 60; i++) {
      const x = rand() * W, y = rand() * H, s = 2 + rand() * 4.5, base = 0.3 + rand() * 0.45;
      const p = sparkle(twinkle, x, y, s, rand() < 0.3 ? '#ffe7c2' : '#e6ebff', base);
      if (video) { const sp = 0.7 + rand() * 2, ph = rand() * 6.28; anim((t, fin) => p.setAttribute('opacity', fin ? base : base * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * sp + ph))))); }
    }

    // ---------- header ----------
    const head = el('g', {}, svg);
    const name = model.me.name || model.me.handle;
    const over = txt(head, M, L.over, '', { 'font-size': 14, fill: C.muted, 'letter-spacing': 5 });
    span(over, '一周星图'); span(over, '   ·   ' + model.rangeLabel, { 'font-family': NUM, 'letter-spacing': 2 });
    txt(head, W - M, L.over, '@' + model.me.handle, { 'text-anchor': 'end', 'font-size': 14, fill: C.gold, 'font-family': NUM, 'letter-spacing': 1.5 });
    el('rect', { x: M, y: L.over + 18, width: W - 2 * M, height: 0.8, fill: 'url(#rule)' }, head);
    const TS = 60;
    const rest = ' 和朋友们的 X 宇宙';
    const title = txt(head, M - 3, L.titleY, '', { 'font-size': TS, 'font-family': SERIF, 'font-weight': 700, fill: C.text, 'letter-spacing': 2 });
    span(title, fit(name, TS, W - 2 * M - measure(rest, TS, 700, SERIF) - 30, 700, SERIF));
    span(title, ' 和朋友们的 ');
    span(title, 'X 宇宙', { fill: 'url(#gold)' });
    const sub = txt(head, M, L.subY, '', { 'font-size': 19, fill: C.muted, 'letter-spacing': 1 });
    span(sub, `${model.stats.posts} 条动态，`);
    span(sub, `${model.stats.stars} 位朋友`, { fill: C.soft });
    span(sub, '，一起点亮了这一周');
    if (video) anim((t) => { const p = outCubic(prog(t, 0.2, 1)); head.setAttribute('opacity', p); head.setAttribute('transform', `translate(0 ${14 * (1 - p)})`); });

    // ---------- chart ----------
    const chart = el('g', {}, svg);
    if (video) anim((t) => { const s = 1 + 0.035 * prog(t, 0, T.end); chart.setAttribute('transform', `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`); });
    const gridL = el('g', {}, chart), dialL = el('g', {}, chart), lineL = el('g', {}, chart), starL = el('g', {}, chart);
    const polar = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    const sweepTime = (a) => T.week0 + T.weekDur * ((((a + Math.PI / 2) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) / (2 * Math.PI);
    const act = model.activity;

    // day sectors: faint meridians from the center out to the dial
    act.daySegs.forEach((seg) => {
      if (seg.from === 0) return;
      const a = slotAngle(seg.from);
      const [x1, y1] = polar(G.me + 22, a), [x2, y2] = polar(G.dial + G.outMax + 6, a);
      const ln = el('line', { x1, y1, x2, y2, stroke: '#e8e4ff', 'stroke-width': 0.7, opacity: 0.09, 'stroke-dasharray': '2 5' }, gridL);
      if (video) anim((t) => ln.setAttribute('opacity', 0.09 * prog(t, 1.6, 0.8)));
    });
    // orbits
    Object.entries(RINGS).forEach(([ring, spec], i) => {
      const halo = ring === 'halo', circ = 2 * Math.PI * spec.R;
      const o = el('circle', { cx, cy, r: spec.R, fill: 'none', stroke: halo ? C.gold : '#e8e4ff', 'stroke-width': halo ? 1 : 0.8, opacity: halo ? 0.28 : 0.12, 'stroke-dasharray': halo ? '1 6' : null }, gridL);
      if (video && !halo) {
        o.setAttribute('transform', `rotate(-90 ${cx} ${cy})`);
        o.setAttribute('stroke-dasharray', circ);
        anim((t) => o.setAttribute('stroke-dashoffset', circ * (1 - outCubic(prog(t, 1.2 + i * 0.18, 1.2)))));
      }
      if (video && halo) anim((t) => o.setAttribute('opacity', 0.28 * prog(t, T.halo - 0.3, 0.6)));
    });

    // ---------- week dial ----------
    el('circle', { cx, cy, r: G.dial, fill: 'none', stroke: C.gold, 'stroke-width': 0.8, opacity: 0.32 }, dialL);
    const dialIn = el('g', {}, dialL);
    for (let h = 0; h < 168; h++) {
      const [x, y] = polar(G.dial + 5, slotAngle(h + 0.5));
      el('circle', { cx: x, cy: y, r: (model.startHour + h) % 6 === 0 ? 1 : 0.6, fill: '#e8e4ff', opacity: 0.3 }, dialIn);
    }
    act.daySegs.forEach((seg) => {
      if (seg.from > 0) {
        const a = slotAngle(seg.from);
        const [x1, y1] = polar(G.dial - 8, a), [x2, y2] = polar(G.dial + 10, a);
        el('line', { x1, y1, x2, y2, stroke: C.gold, 'stroke-width': 1, opacity: 0.55 }, dialIn);
      }
      if (seg.to - seg.from < 10) return;
      const a = slotAngle((seg.from + seg.to) / 2);
      const [x, y] = polar(G.dayR, a);
      const rot = deg(a) + 90 - (Math.sin(a) > 0.01 ? 180 : 0);
      const hot = act.total && act.peakSlot >= seg.from && act.peakSlot < seg.to;
      const t = txt(dialIn, 0, 0, '', { transform: `translate(${x} ${y}) rotate(${rot})`, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 13, fill: hot ? C.gold : C.muted, 'letter-spacing': 2 });
      span(t, '周' + DAYS[seg.dow]);
      span(t, '  ' + seg.date, { 'font-family': NUM, 'font-size': 11.5, fill: hot ? C.gold : C.dim, 'letter-spacing': 1 });
    });
    if (video) anim((t) => { dialIn.setAttribute('opacity', prog(t, 1.6, 0.8)); });
    // hourly bars: friends outward, me inward
    const maxC = Math.max(1, ...act.weekCircle), maxM = Math.max(1, ...act.weekMe);
    for (let h = 0; h < 168; h++) {
      const a = slotAngle(h + 0.5), peak = act.total && h === act.peakSlot;
      const bars = [];
      if (act.weekCircle[h]) {
        const len = 3 + Math.pow(act.weekCircle[h] / maxC, 0.7) * (G.outMax - 3);
        bars.push([G.dial + 3, len, peak ? C.gold : C.circle, peak ? 1 : 0.5 + 0.45 * act.weekCircle[h] / maxC]);
      }
      if (act.weekMe[h]) {
        const len = 2 + Math.pow(act.weekMe[h] / maxM, 0.7) * (G.inMax - 2);
        bars.push([G.dial - 3, -len, C.me, 0.85]);
      }
      bars.forEach(([r0, len, color, op]) => {
        const [x1, y1] = polar(r0, a);
        const b = el('line', { x1, y1, x2: x1, y2: y1, stroke: color, 'stroke-width': 3.4, 'stroke-linecap': 'round', opacity: op }, dialL);
        const set = (p) => { const [x2, y2] = polar(r0 + len * p, a); b.setAttribute('x2', x2); b.setAttribute('y2', y2); };
        set(1);
        if (video) { const t0 = sweepTime(a); anim((t) => set(outCubic(prog(t, t0, 0.45)))); }
      });
      if (peak) {
        const [x, y] = polar(G.dial + 3 + G.outMax + 9, a);
        const pk = el('g', { transform: `translate(${x} ${y})` }, dialL);
        el('circle', { r: 9, fill: 'url(#glow-follow)' }, pk);
        sparkle(pk, 0, 0, 6, C.gold, 1);
        if (video) { const t0 = sweepTime(a) + 0.3; anim((t) => pk.setAttribute('opacity', prog(t, t0, 0.4))); }
      }
    }

    // ---------- people ----------
    const placed = { inner: [], middle: [], outer: [], halo: [] };
    const offsets = { inner: -Math.PI / 2 + 0.38, middle: -Math.PI / 2 + 0.16, outer: -Math.PI / 2 + 0.07, halo: -Math.PI / 2 + 0.2 };
    Object.keys(RINGS).forEach((ring) => {
      const spec = RINGS[ring], list = model.rings[ring];
      if (!list.length) return;
      const step = (Math.PI * 2) / list.length;
      list.forEach((s, j) => {
        const r1 = rng(hash(s.handle));
        const a = offsets[ring] + (list.length > 1 ? j * step + (r1() - 0.5) * step * 0.3 : 0);
        const rr = spec.R + (r1() - 0.5) * spec.jit * 2;
        const [x, y] = polar(rr, a);
        const size = spec.size * (ring === 'inner' || ring === 'middle' ? 0.88 + 0.24 * s.weight : 1);
        placed[ring].push({ ...s, a, x, y, size, arc: step * rr, t0: ring === 'halo' ? T.halo + 0.25 + j * 0.035 : sweepTime(a) });
      });
    });

    // constellation lines
    const angDiff = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
    const nearest = (s, list) => list.reduce((best, o) => (!best || angDiff(s.a, o.a) < angDiff(s.a, best.a) ? o : best), null);
    const line = (a, b, op, dash) => {
      const l = el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: '#ece8ff', 'stroke-width': 0.8, opacity: op, 'stroke-dasharray': dash }, lineL);
      if (video) { const t0 = Math.max(a.t0, b.t0) + 0.2; anim((t) => l.setAttribute('opacity', op * prog(t, t0, 0.5))); }
    };
    const meNode = { x: cx, y: cy, t0: 1.2 };
    placed.inner.forEach((s) => line(meNode, s, 0.2));
    const ring1 = [...placed.inner].sort((a, b) => a.a - b.a);
    if (ring1.length > 2) ring1.forEach((s, i) => line(s, ring1[(i + 1) % ring1.length], 0.26));
    placed.middle.forEach((s) => line(s, nearest(s, placed.inner), 0.16));
    placed.outer.forEach((s) => line(s, nearest(s, placed.middle) || nearest(s, placed.inner), 0.11, '2 4'));

    // me: a small, quiet center, about the size of my friends
    const meG = el('g', { transform: `translate(${cx} ${cy})` }, starL);
    const pulse = el('circle', { r: G.me, fill: 'none', stroke: C.gold, 'stroke-width': 1, opacity: 0 }, meG);
    const meIn = el('g', {}, meG);
    el('circle', { r: G.me * 3.4, fill: 'url(#sun)' }, meIn);
    avatar(meIn, G.me, model.me.avatarData, name, model.me.handle, defs);
    el('circle', { r: G.me + 2.2, fill: 'none', stroke: 'url(#gold)', 'stroke-width': 1.8 }, meIn);
    el('circle', { r: G.me + 8, fill: 'none', stroke: C.gold, 'stroke-width': 0.8, opacity: 0.4, 'stroke-dasharray': '1 3' }, meIn);
    if (video) {
      anim((t) => { const p = prog(t, 0.9, 0.8); meIn.setAttribute('transform', `scale(${outBack(p)})`); meIn.setAttribute('opacity', clamp01(p * 2)); });
      anim((t) => {
        const q = t < 2 ? -1 : ((t - 2) % 2.4) / 2.4;
        pulse.setAttribute('r', G.me + 4 + 46 * outCubic(Math.max(0, q)));
        pulse.setAttribute('opacity', q < 0 ? 0 : 0.5 * (1 - q));
      });
    }

    Object.entries(placed).forEach(([ring, list]) => list.forEach((s) => {
      const spec = RINGS[ring], color = C[s.kind];
      const g = el('g', { transform: `translate(${s.x} ${s.y})` }, starL);
      const inner = el('g', {}, g);
      el('circle', { r: s.size * 2.4, fill: `url(#glow-${s.kind})` }, inner);
      if (ring === 'inner') {
        const sl = s.size * 2.5;
        el('rect', { x: -sl, y: -0.6, width: 2 * sl, height: 1.2, fill: 'url(#spikeH)', opacity: 0.55 }, inner);
        el('rect', { x: -0.6, y: -sl, width: 1.2, height: 2 * sl, fill: 'url(#spikeV)', opacity: 0.55 }, inner);
      }
      avatar(inner, s.size, s.avatarData, s.name, s.handle, defs);
      el('circle', { r: s.size + 1.8, fill: 'none', stroke: color, 'stroke-width': ring === 'inner' ? 1.6 : 1.2 }, inner);
      if (s.isNew) sparkle(inner, s.size * 0.74, -s.size * 0.74, Math.max(4.5, s.size * 0.28), C.follow, 1);
      const fs = spec.label;
      const maxW = Math.min(s.arc * 0.92, ring === 'inner' ? 130 : 96);
      txt(inner, 0, s.size + fs + 5, fit(s.name || s.handle, fs, maxW, ring === 'inner' ? 500 : 400), {
        'text-anchor': 'middle', 'font-size': fs, fill: ring === 'halo' ? C.gold : C.text,
        opacity: ring === 'inner' ? 0.95 : ring === 'middle' ? 0.85 : 0.68, 'font-weight': ring === 'inner' ? 500 : 400,
      });
      if (ring === 'inner') {
        const parts = [['♥', s.c.like, C.like], ['↻', s.c.repost, C.repost], ['❝', s.c.reply + s.c.quote + s.c.mention, C.reply]].filter((p) => p[1] > 0);
        const ct = txt(inner, 0, s.size + fs + 22, '', { 'text-anchor': 'middle', 'font-size': 11, fill: C.muted, 'font-family': NUM });
        parts.forEach(([g2, n, c], i) => { span(ct, (i ? '   ' : '') + g2 + ' ', { fill: c, 'font-family': SANS }); span(ct, String(n)); });
      }
      if (video) anim((t) => { const p = prog(t, s.t0, 0.5); inner.setAttribute('transform', `scale(${outBack(p)})`); inner.setAttribute('opacity', clamp01(p * 2.5)); });
    }));

    // ---------- video: radar sweep, halo ripple, week clock ----------
    if (video) {
      const sweep = el('g', {}, chart);
      const trail = 40, R = G.dial;
      for (let i = 0; i < trail; i++) {
        const a0 = -((i + 1) * 1.3 * Math.PI) / 180, a1 = -(i * 1.3 * Math.PI) / 180;
        el('path', { d: `M0 0L${R * Math.cos(a0)} ${R * Math.sin(a0)}A${R} ${R} 0 0 1 ${R * Math.cos(a1)} ${R * Math.sin(a1)}Z`, fill: C.gold, opacity: 0.13 * Math.pow(1 - i / trail, 1.6) }, sweep);
      }
      el('line', { x1: G.me + 12, y1: 0, x2: G.dial + G.outMax + 8, y2: 0, stroke: C.gold, 'stroke-width': 6, opacity: 0.12, 'stroke-linecap': 'round' }, sweep);
      el('line', { x1: G.me + 12, y1: 0, x2: G.dial + G.outMax + 8, y2: 0, stroke: '#fff3d6', 'stroke-width': 1.3, opacity: 0.95 }, sweep);
      anim((t) => {
        const p = prog(t, T.week0, T.weekDur);
        sweep.setAttribute('transform', `translate(${cx} ${cy}) rotate(${-90 + 360 * p})`);
        sweep.setAttribute('opacity', Math.min(prog(t, T.week0 - 0.3, 0.3), 1 - prog(t, T.week0 + T.weekDur, 0.5)));
      });
      const ripple = el('circle', { cx, cy, r: 0, fill: 'none', stroke: C.gold, 'stroke-width': 2 }, chart);
      anim((t) => { const p = prog(t, T.halo - 0.2, 1.1); ripple.setAttribute('r', G.me + (RINGS.halo.R + 40 - G.me) * outCubic(p)); ripple.setAttribute('opacity', p > 0 && p < 1 ? 0.6 * (1 - p) : 0); });

      const clock = el('g', {}, svg);
      const lbl = txt(clock, W / 2, L.clockY, '', { 'text-anchor': 'middle', 'font-size': 26, fill: C.gold, 'font-family': SERIF, 'font-weight': 600, 'letter-spacing': 3 });
      anim((t) => {
        const p = prog(t, T.week0, T.weekDur);
        const h = Math.min(167, Math.floor(p * 168));
        const seg = act.daySegs.find((d) => h >= d.from && h < d.to) || act.daySegs[0];
        lbl.textContent = p >= 1 ? '一周 · 圆满' : `周${DAYS[seg.dow]}  ${String((model.startHour + h) % 24).padStart(2, '0')}:00`;
        clock.setAttribute('opacity', prog(t, 1.8, 0.6) * (1 - prog(t, T.post, 0.6)));
      });
    }

    // ---------- stats ----------
    const counters = [];
    const stat = (parent, x, y, anchor, glyph, color, label, n, plus, size) => {
      const g = el('g', {}, parent);
      const right = anchor === 'end', mid = anchor === 'middle';
      const lt = txt(g, mid ? x : right ? x - 26 : x + 26, y, '', { 'text-anchor': anchor, 'font-size': 14, fill: C.muted, 'letter-spacing': 4 });
      span(lt, glyph + ' ', { fill: color }); span(lt, label);
      if (!mid) el('rect', { x: right ? x - 18 : x, y: y - 5, width: 18, height: 1, fill: C.gold, opacity: 0.6 }, g);
      const num = txt(g, x, y + size + 6, fmt(n, plus), { 'text-anchor': anchor, 'font-size': size, 'font-family': NUM, 'font-weight': 200, fill: plus ? 'url(#gold)' : C.text, 'letter-spacing': 1 });
      counters.push([num, n, plus]);
      return g;
    };
    const st = model.stats;
    const statG = el('g', {}, svg);
    if (L.corners) {
      const [top, bottom] = L.corners;
      stat(statG, M, top, 'start', '♥', C.like, '获赞', st.likes, false, 50);
      stat(statG, W - M, top, 'end', '❝', C.reply, '回复', st.replies, false, 50);
      stat(statG, M, bottom, 'start', '↻', C.repost, '转发', st.reposts, false, 50);
      stat(statG, W - M, bottom, 'end', '✦', C.follow, '新关注', st.newFollowers, true, 50);
    } else {
      [['✎', C.text, '发帖', st.posts], ['♥', C.like, '获赞', st.likes], ['↻', C.repost, '转发', st.reposts], ['❝', C.reply, '回复', st.replies], ['✦', C.follow, '新关注', st.newFollowers, true]]
        .forEach(([g2, c, label, n, plus], i, arr) => stat(statG, M + (W - 2 * M) * (i + 0.5) / arr.length, L.statsY, 'middle', g2, c, label, n, plus, 48));
    }
    if (video) {
      anim((t) => statG.setAttribute('opacity', prog(t, T.week0 - 0.6, 0.6)));
      counters.forEach(([num, n, plus]) => anim((t) => { const p = plus ? outCubic(prog(t, T.halo, 1.2)) : outCubic(prog(t, T.week0, T.weekDur)); num.textContent = fmt(Math.round(n * p), plus); }));
    }

    // ---------- footer: brightest post + brightest hour ----------
    const foot = el('g', {}, svg);
    const fy = L.footY, colX = 700;
    const caption = (x, y, s) => { el('rect', { x, y: y - 5, width: 18, height: 1, fill: C.gold, opacity: 0.6 }, foot); txt(foot, x + 26, y, s, { 'font-size': 14, fill: C.muted, 'letter-spacing': 4 }); };
    caption(M, fy, '本周最亮的一颗星');
    const top = model.topPost;
    if (top) {
      const PW = colX - M - 60;
      wrap(top.text || '（图片 / 视频）', 20, PW, 2, SERIF).forEach((ln, i) => txt(foot, M, fy + 36 + i * 29, ln, { 'font-size': 20, fill: C.text, 'font-family': SERIF }));
      const meta = txt(foot, M, fy + 94, '', { 'font-size': 13.5, fill: C.muted, 'font-family': NUM, 'letter-spacing': 0.5 });
      span(meta, top.when, { 'font-family': SANS });
      [['♥', top.likes, C.like], ['↻', top.reposts, C.repost], ['❝', top.replies, C.reply]].forEach(([g2, n, c]) => { span(meta, '     ' + g2 + ' ', { fill: c, 'font-family': SANS }); span(meta, fmt(n)); });
      const row = el('g', { transform: `translate(${M + 13} ${fy + 124})` }, foot);
      top.fans.forEach((f, i) => {
        const g = el('g', { transform: `translate(${i * 22} 0)` }, row);
        el('circle', { r: 14, fill: '#070914' }, g);
        avatar(g, 12.5, f.avatarData, f.name, f.handle, defs);
      });
      if (top.fanCount) txt(foot, M + 13 + top.fans.length * 22 + 6, fy + 129, top.fanCount > top.fans.length ? `等 ${top.fanCount} 位朋友点亮了它` : '点亮了它', { 'font-size': 13.5, fill: C.muted });
    } else {
      txt(foot, M, fy + 40, '这周还没有发帖，下周见 ✨', { 'font-size': 19, fill: C.muted, 'font-family': SERIF });
    }
    el('rect', { x: colX - 34, y: fy - 14, width: 0.8, height: 150, fill: C.gold, opacity: 0.22 }, foot);
    caption(colX, fy, '最闪耀时刻');
    if (act.total) {
      txt(foot, colX, fy + 56, act.peak, { 'font-size': 40, fill: 'url(#gold)', 'font-family': SERIF, 'font-weight': 700, 'letter-spacing': 2 });
      const who = [['我最常出没', act.meHour, C.me], ['朋友们最活跃', act.circleHour, C.circle]].filter((w) => w[1] != null);
      who.forEach(([label, hr, c], i) => {
        const t = txt(foot, colX, fy + 100 + i * 28, '', { 'font-size': 14.5, fill: C.muted, 'letter-spacing': 1 });
        span(t, '● ', { fill: c, 'font-size': 10 }); span(t, label + '  '); span(t, `${hr}:00`, { fill: C.soft, 'font-family': NUM });
      });
    } else {
      txt(foot, colX, fy + 44, '这一周还很安静', { 'font-size': 19, fill: C.muted, 'font-family': SERIF });
    }
    if (video) anim((t) => { const p = outCubic(prog(t, T.post, 0.9)); foot.setAttribute('opacity', p); foot.setAttribute('transform', `translate(0 ${16 * (1 - p)})`); });

    // ---------- legend ----------
    const legend = txt(svg, W / 2, L.legendY, '', { 'text-anchor': 'middle', 'font-size': 12.5, fill: C.dim, 'letter-spacing': 1 });
    [['♥', '喜欢', C.like], ['↻', '转发', C.repost], ['❝', '回复 / 引用', C.reply], ['✦', '新关注', C.follow]].forEach(([g2, s, c], i) => { span(legend, (i ? '    ' : '') + g2 + ' ', { fill: c }); span(legend, s); });
    span(legend, '    ·    离中心越近，互动越多    ·    外环：每小时的动态，');
    span(legend, '朋友们', { fill: C.circle, 'fill-opacity': 0.8 }); span(legend, '向外，'); span(legend, '我', { fill: C.me }); span(legend, '向内');
    if (video) anim((t) => legend.setAttribute('opacity', prog(t, T.post + 0.4, 0.8)));

    // ---------- thanks (video) ----------
    if (video) {
      const th = txt(svg, W / 2, L.thanksY, '谢谢你们，照亮了我的一周', { 'text-anchor': 'middle', 'font-size': 40, fill: 'url(#gold)', 'font-family': SERIF, 'font-weight': 700, 'letter-spacing': 6 });
      const th2 = txt(svg, W / 2, L.thanksY + 50, '下周，继续在这里相遇', { 'text-anchor': 'middle', 'font-size': 19, fill: C.muted, 'letter-spacing': 6 });
      anim((t) => { const p = outCubic(prog(t, T.thanks, 1.1)); th.setAttribute('opacity', p); th.setAttribute('transform', `translate(0 ${12 * (1 - p)})`); th2.setAttribute('opacity', prog(t, T.thanks + 0.6, 1)); });
      const curtain = el('rect', { width: W, height: H, fill: '#04050b' }, svg);
      anim((t) => curtain.setAttribute('opacity', 1 - prog(t, 0, 0.7)));
    }

    return { duration: T.end, width: W, height: H };
  }

  function sparkle(parent, x, y, s, color, op) {
    const k = s * 0.16;
    return el('path', { d: `M${x} ${y - s}C${x + k} ${y - k} ${x + k} ${y - k} ${x + s} ${y}C${x + k} ${y + k} ${x + k} ${y + k} ${x} ${y + s}C${x - k} ${y + k} ${x - k} ${y + k} ${x - s} ${y}C${x - k} ${y - k} ${x - k} ${y - k} ${x} ${y - s}Z`, fill: color, opacity: op }, parent);
  }
  function fmt(n, plus) {
    const s = n >= 1e4 ? (n / 1e4).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + '万' : String(n);
    return plus ? '+' + s : s;
  }
  function frame(t) {
    const fin = t == null || !isFinite(t);
    const tt = fin ? 1e6 : t;
    anims.forEach((f) => f(tt, fin));
  }

  window.XC = { build, frame };
})();
</script>
</body>
</html>
